apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sre-ecs-web-hpa
  namespace: sre-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sre-ecs-web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30